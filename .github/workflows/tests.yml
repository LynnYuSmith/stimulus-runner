name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: protocol tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Protocol unit tests
        run: node test/protocol.test.js
      - name: Export tests — the buttons actually clicked
        run: node test/exports.test.js
      - name: Syntax-check the page and the server
        run: |
          node --check protocol.js
          python3 -m py_compile serve.py
          python3 -m py_compile labchart_comments.py send_test_comment.py labchart_agent/labchart_agent.py
      - name: LabChart comments, end to end against a fake LabChart
        run: python3 test/labchart_comments.test.py
      - name: The comment agent lets in only the computers it is told to
        run: python3 test/labchart_agent_allow.test.py
